name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare environment configuration
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            touch .env
            if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
            fi
            if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
            fi
            if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
              echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
            fi
            if [ -n "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
              echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare HygieneTruth.apk artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk HygieneTruth.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HygieneTruth
          path: HygieneTruth.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HygieneTruth.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
